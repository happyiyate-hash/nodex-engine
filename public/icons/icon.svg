<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c26" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0a0c10" stop-opacity="1" />
      <stop offset="100%" stop-color="#050608" stop-opacity="1" />
    </radialGradient>

    <!-- Solana Gradient -->
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="45%" stop-color="#03E1FF" />
      <stop offset="100%" stop-color="#DC1FFF" />
    </linearGradient>

    <!-- Subtle Silver Shimmer -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4D4D8" />
      <stop offset="100%" stop-color="#71717A" />
    </linearGradient>

    <!-- Accent Emerald -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#262626" stroke-width="2.5" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#solanaGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Technical Grid Matrix Lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="80" x2="432" y2="80" stroke-dasharray="4,6" />
    <line x1="80" y1="432" x2="432" y2="432" stroke-dasharray="4,6" />
    <line x1="80" y1="80" x2="80" y2="432" stroke-dasharray="4,6" />
    <line x1="432" y1="80" x2="432" y2="432" stroke-dasharray="4,6" />
    <circle cx="256" cy="256" r="140" fill="none" stroke-dasharray="3,7" />
  </g>

  <!-- Technical Corner Crosshairs -->
  <g stroke="#71717A" stroke-width="2" opacity="0.65">
    <path d="M 80,95 L 80,80 L 95,80" fill="none" />
    <path d="M 432,95 L 432,80 L 417,80" fill="none" />
    <path d="M 80,417 L 80,432 L 95,432" fill="none" />
    <path d="M 432,417 L 432,432 L 417,432" fill="none" />
  </g>

  <!-- Central Ambient Solana Blur Sphere -->
  <circle cx="256" cy="256" r="85" fill="url(#solanaGrad)" opacity="0.22" filter="url(#neonGlow)" />

  <!-- Iconic NodeX Geometric Monogram (N + X + Interlocking Blocks) -->
  <!-- Left Pillar of N -->
  <path d="M 148,156 L 192,156 L 192,356 L 148,356 Z" 
        fill="url(#silverGrad)" 
        rx="8" />

  <!-- Right Pillar of N / First limb of X -->
  <path d="M 320,156 L 364,156 L 364,356 L 320,356 Z" 
        fill="url(#silverGrad)" 
        rx="8" />

  <!-- Dynamic Solana Speed Blade (Connecting diagonal slash forming N and crossing into X) -->
  <path d="M 184,164 C 184,158 190,154 196,158 L 324,348 C 328,354 322,358 316,354 L 188,164 Z"
        fill="url(#solanaGrad)"
        filter="url(#subtleGlow)" />

  <!-- Crossing Blade forming the X -->
  <path d="M 324,164 C 324,158 318,154 312,158 L 268,222 C 264,228 274,234 278,228 L 322,166 Z"
        fill="url(#solanaGrad)" />
        
  <path d="M 188,348 C 188,354 194,358 200,354 L 244,290 C 248,284 238,278 234,284 L 190,346 Z"
        fill="url(#solanaGrad)" />

  <!-- Floating Institutional Pulse Beacon (Pump.fun pulse homage) -->
  <circle cx="364" cy="156" r="14" fill="#00FFA3" filter="url(#neonGlow)" />
  <circle cx="364" cy="156" r="7" fill="#FFFFFF" />

  <!-- Live Pulse Waves around beacon -->
  <circle cx="364" cy="156" r="24" fill="none" stroke="#00FFA3" stroke-width="2" opacity="0.4" />

  <!-- Technical Label Typography -->
  <text x="256" y="408" 
        font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="9" 
        fill="#FFFFFF" 
        text-anchor="middle">NODEX</text>

  <text x="256" y="432" 
        font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#00FFA3" 
        text-anchor="middle">SOLANA TERMINAL</text>
</svg>
