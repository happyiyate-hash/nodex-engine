# Render Blueprint for the NodeX full-stack terminal.
# This app runs an Express server and serves the Vite-built React frontend.
# Keep this as one Web Service; do not add a Static Site for the same app.

services:
  - type: web
    name: nodex-terminal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
