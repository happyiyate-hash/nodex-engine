name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build NodeX Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Prepare NodeX app icon
        run: |
          mkdir -p assets
          cp public/icons/icon.svg assets/icon.svg

      - name: Generate Android platform
        run: npx cap add android

      - name: Generate native app icons and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#080808' --splashBackgroundColor '#080808'

      - name: Sync web application into Android
        run: npx cap sync android

      - name: Build Android debug and release variants
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Sign release APK
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="android/app/build/outputs/apk/release/NodeX-terminal-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$unsigned"
          test -n "$apksigner"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nodex-release.jks"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/nodex-release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed" "$unsigned"
            echo "signing_mode=release" >> "$GITHUB_OUTPUT"
          else
            test -f "$HOME/.android/debug.keystore"
            "$apksigner" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$signed" "$unsigned"
            echo "signing_mode=personal-test" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secrets configured. The release APK is signed with this runner's temporary debug key for personal testing only. Configure the four ANDROID_* secrets for a stable, production-grade signing identity."
          fi

          "$apksigner" verify --verbose "$signed"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NodeX-Android-APKs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/NodeX-terminal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Android release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signing_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/NodeX-terminal-release.apk
          generate_release_notes: true
