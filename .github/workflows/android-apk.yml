name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build NodeX Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check frontend
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Prepare NodeX app icon
        run: |
          mkdir -p assets
          cp public/icons/icon.svg assets/icon.svg

      - name: Generate Android platform
        run: npx cap add android

      - name: Generate native app icons and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#080808' --splashBackgroundColor '#080808'

      - name: Sync web application into Android
        run: npx cap sync android

      - name: Build Android debug and release variants
        id: android_build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Create a fresh Android signing keystore and sign release APK
        id: signing
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="android/app/build/outputs/apk/release/NodeX-terminal-release.apk"
          keystore="$RUNNER_TEMP/nodex-build-signing.jks"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          test -f "$unsigned"
          test -n "$apksigner"
          test -n "$(command -v keytool)"

          # Create a new, build-local signing identity on every workflow run.
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -keystore "$keystore" \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias nodex-build \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NodeX Personal Build, OU=Android, O=NodeX, C=NG"

          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias nodex-build \
            --ks-pass "pass:$store_password" \
            --key-pass "pass:$key_password" \
            --out "$signed" "$unsigned"

          "$apksigner" verify --verbose "$signed"
          echo "signing_mode=ephemeral-personal-test" >> "$GITHUB_OUTPUT"
          echo "::warning::This APK uses a new temporary signing identity for this build. Uninstall an older differently-signed copy before installing it. This key is not suitable for Play Store updates or stable release distribution."

      - name: Upload debug APK artifact
        if: always() && steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NodeX-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK artifact
        if: always() && steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NodeX-Android-release
          path: android/app/build/outputs/apk/release/NodeX-terminal-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Android release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signing_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/NodeX-terminal-release.apk
          generate_release_notes: true
